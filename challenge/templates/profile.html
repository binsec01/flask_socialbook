<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Picture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .profile-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            background: white;
        }
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .profile-image-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
        }
        .profile-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .profile-image:hover {
            transform: scale(1.05);
        }
        .profile-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #0d6efd;
        }
        .stat-label {
            color: #6c757d;
            font-size: 14px;
        }
        .btn-custom {
            padding: 10px 25px;
            border-radius: 25px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .profile-info {
            text-align: center;
            margin: 20px 0;
        }
        .profile-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .profile-bio {
            color: #6c757d;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-container">
            <div class="profile-header">
                <h2 class="mb-4">Profile Picture</h2>
            </div>

            <div class="profile-image-container">
                <img src="{{ url_for('uploaded_file', filename=filename) }}" 
                     alt="Profile Picture" 
                     class="profile-image">
            </div>

            <div class="profile-info">
                <div class="profile-name">John Doe</div>
                <div class="profile-bio">Photography enthusiast | Travel lover</div>
            </div>

            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-value">1.2K</div>
                    <div class="stat-label">Followers</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">850</div>
                    <div class="stat-label">Following</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">245</div>
                    <div class="stat-label">Posts</div>
                </div>
            </div>

            <div class="profile-actions">
                <a href="{{ url_for('index') }}" class="btn btn-primary btn-custom">
                    <i class="bi bi-upload me-2"></i>Upload New Picture
                </a>
                <button class="btn btn-outline-primary btn-custom">
                    <i class="bi bi-share me-2"></i>Share Profile
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
